[project]
name = "cctv-noc-huancayo"
version = "0.1.0"
description = "Sistema local de monitoreo CCTV NOC Huancayo"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
video = [
    "av>=14,<17",
    "opencv-python>=4.10,<5",
]
vision = [
    "av>=14,<17",
    "opencv-python>=4.10,<5",
    "ultralytics>=8,<9",
]
postgres = [
    "psycopg2-binary>=2.9,<3",
]

[tool.uv]
package = false
